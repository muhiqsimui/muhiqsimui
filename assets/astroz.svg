<svg class="astronaut" viewBox="0 0 1167 807" xmlns="http://www.w3.org/2000/svg" style="background: radial-gradient(ellipse at center, #0a0a2a 0%, #030318 100%); overflow: hidden;">
  <title>Astronaut Neo - Redesign Keren</title>
  
  <defs>
    <!-- Gradien Futuristik untuk Suit -->
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2c54"/>
      <stop offset="50%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0f0f2a"/>
    </linearGradient>
    
    <linearGradient id="suitHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a5a8a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2a2a5a" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Gradien Visor Keren (Cyan ke Magenta) -->
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff2e63" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Gradien untuk Efek Thruster -->
    <radialGradient id="thrusterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6a00" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ff2e63" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff2e63" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter Neon Glow yang Lebih Kuat -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Filter untuk Efek Partikel / Bintang Glow -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Mask untuk Efek Scan Visor -->
    <mask id="visorMask">
      <rect width="1167" height="807" fill="white"/>
      <circle cx="0" cy="0" r="150" fill="black">
        <animate attributeName="cy" values="0; 200; 0" dur="8s" repeatCount="indefinite"/>
      </circle>
    </mask>
  </defs>

  <style>
    /* Animasi Baru yang Lebih Keren */
    @keyframes levitate {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-15px) scale(1.02); }
    }
    @keyframes floatArmL {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }
    @keyframes floatArmR {
      0%, 100% { transform: rotate(5deg); }
      50% { transform: rotate(-5deg); }
    }
    @keyframes floatLegL {
      0%, 100% { transform: rotate(3deg); }
      50% { transform: rotate(-3deg); }
    }
    @keyframes floatLegR {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0); }
    }
    @keyframes visorPulse {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 5px #00f2fe) drop-shadow(0 0 15px #ff2e63); }
      50% { opacity: 1; filter: drop-shadow(0 0 15px #00f2fe) drop-shadow(0 0 30px #ff2e63); }
    }
    @keyframes starsRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    @keyframes shootingStar {
      0% { transform: translateX(-100px) translateY(-100px) rotate(45deg); opacity: 0; }
      10% { opacity: 1; }
      30% { opacity: 1; }
      100% { transform: translateX(400px) translateY(400px) rotate(45deg); opacity: 0; }
    }
    @keyframes thrusterFire {
      0%, 100% { transform: scaleY(1); opacity: 0.8; }
      50% { transform: scaleY(1.5); opacity: 1; }
    }

    /* Penerapan Animasi ke Elemen */
    .astronaut-body { animation: levitate 4s ease-in-out infinite; transform-origin: center; }
    .arm-left { animation: floatArmL 5s ease-in-out infinite; transform-origin: 85% 65%; }
    .arm-right { animation: floatArmR 5s ease-in-out infinite; transform-origin: 15% 65%; }
    .leg-left { animation: floatLegL 4.5s ease-in-out infinite; transform-origin: 40% 80%; }
    .leg-right { animation: floatLegR 4.5s ease-in-out infinite; transform-origin: 60% 80%; }
    .eye-left, .eye-right { animation: blink 4s infinite; transform-origin: center; }
    .face-visor { animation: visorPulse 3s infinite alternate; }
    .star { animation: twinkle 3s infinite alternate; transform-origin: center; }
    .star:nth-child(odd) { animation-duration: 2.5s; animation-delay: -1s; }
    .star:nth-child(3n) { animation-duration: 4s; animation-delay: -2s; }
    .stars { animation: starsRotate 200s linear infinite; transform-origin: center; }
    .shooting-star { animation: shootingStar 6s linear infinite; }
    .shooting-star:nth-child(2) { animation-delay: 3s; left: 70%; top: 20%; }
    .thruster-flame { animation: thrusterFire 0.2s ease-in-out infinite; transform-origin: top; }
  </style>

  <!-- Background dengan Bintang Berkedip dan Nebula -->
  <rect width="100%" height="100%" fill="url(#spaceGrad)" opacity="0.3"/>
  <g class="stars" fill="#ffffff" filter="url(#starGlow)">
    <!-- Bintang-bintang kecil dengan animasi twinkle -->
    <circle class="star" cx="75" cy="212" r="2.5"/>
    <circle class="star" cx="148" cy="251" r="2"/>
    <circle class="star" cx="197" cy="140" r="1.5"/>
    <circle class="star" cx="278" cy="231" r="3"/>
    <circle class="star" cx="238" cy="59" r="2"/>
    <circle class="star" cx="168" cy="359" r="2.5"/>
    <circle class="star" cx="327" cy="120" r="1.5"/>
    <circle class="star" cx="448" cy="212" r="2"/>
