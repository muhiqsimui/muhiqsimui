    <circle class="star" cx="377" cy="480" r="1.5"/>
    <circle class="star" cx="498" cy="572" r="2"/>
    <circle class="star" cx="571" cy="611" r="2.5"/>
    <circle class="star" cx="620" cy="500" r="1.5"/>
    <circle class="star" cx="701" cy="591" r="2"/>
    <circle class="star" cx="631" cy="521" r="2"/>
    <circle class="star" cx="661" cy="419" r="3"/>
    <circle class="star" cx="750" cy="480" r="1.5"/>
    <circle class="star" cx="481" cy="709" r="2.5"/>
    <circle class="star" cx="118" cy="709" r="2"/>
  </g>

  <!-- Bintang Jatuh (Shooting Stars) -->
  <line class="shooting-star" x1="200" y1="100" x2="0" y2="300" stroke="url(#starGlow)" stroke-width="2" stroke-linecap="round"/>
  <line class="shooting-star" x1="800" y1="150" x2="600" y2="350" stroke="url(#starGlow)" stroke-width="2" stroke-linecap="round"/>

  <!-- Grup Utama Astronaut dengan Animasi Body -->
  <g class="astronaut-body">
    
    <!-- Jetpack & Thruster (Efek Api) -->
    <g transform="translate(540, 320)">
      <ellipse cx="0" cy="120" rx="60" ry="30" fill="#1a1a3e" stroke="#4facfe" stroke-width="2" filter="url(#neonGlow)"/>
      <rect x="-30" y="100" width="60" height="40" rx="5" fill="#2c2c54"/>
      <!-- Thruster Kiri -->
      <g transform="translate(-40, 140)">
        <path d="M-15,0 L0,40 L15,0 Z" fill="#ff2e63" class="thruster-flame" filter="url(#neonGlow)"/>
        <ellipse cx="0" cy="0" rx="20" ry="10" fill="#6a6a9a"/>
      </g>
      <!-- Thruster Kanan -->
      <g transform="translate(40, 140)">
        <path d="M-15,0 L0,40 L15,0 Z" fill="#ff2e63" class="thruster-flame" filter="url(#neonGlow)"/>
        <ellipse cx="0" cy="0" rx="20" ry="10" fill="#6a6a9a"/>
