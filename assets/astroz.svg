    <circle class="star" cx="125" cy="572" r="2"/>
    <circle class="star" cx="198" cy="611" r="2.5"/>
    <circle class="star" cx="247" cy="500" r="1.5"/>
    <circle class="star" cx="328" cy="591" r="2"/>
    <circle class="star" cx="258" cy="521" r="2"/>
