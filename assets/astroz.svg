    <circle class="star" cx="570" cy="140" r="1.5"/>
    <circle class="star" cx="651" cy="231" r="3"/>
    <circle class="star" cx="611" cy="59" r="2"/>
    <circle class="star" cx="541" cy="359" r="2"/>
